name: Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:

# Never let two deploys interleave: the second would rsync over a half-written
# release directory while the first is still swapping it.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build
        run: dotnet build TraderApp/TraderApp.csproj -c Release --nologo

      # Runs nothing today, but the moment a test project is added this gates
      # the deploy on it rather than silently shipping.
      - name: Test
        run: |
          if ls **/*Tests*.csproj >/dev/null 2>&1; then
            dotnet test -c Release --nologo
          else
            echo "no test projects yet - skipping"
          fi

      - name: Publish self-contained
        run: >
          dotnet publish TraderApp/TraderApp.csproj
          -c Release
          -r ${{ vars.DOTNET_RID || 'linux-x64' }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o ./publish
          --nologo

      - name: Record the deployed commit
        run: echo "${{ github.sha }}" > ./publish/DEPLOYED_SHA

      - uses: actions/upload-artifact@v4
        with:
          name: trader
          path: publish/
          retention-days: 7

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment: production
    if: ${{ vars.DEPLOY_HOST != '' }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: trader
          path: publish

      - name: Upload build to the VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ vars.DEPLOY_SSH_PORT || 22 }}
          source: "publish/*"
          target: ${{ vars.DEPLOY_INCOMING || '/opt/trader/incoming' }}
          strip_components: 1
          overwrite: true
          rm: true

      - name: Swap release, restart, verify
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ vars.DEPLOY_SSH_PORT || 22 }}
          envs: DEPLOY_APP,DEPLOY_INCOMING
          script: |
            set -euo pipefail
            APP="${DEPLOY_APP:-/opt/trader/app}"
            IN="${DEPLOY_INCOMING:-/opt/trader/incoming}"
            PREV="/opt/trader/previous"

            test -x "$IN/TraderApp" || { echo "no TraderApp binary in $IN"; exit 1; }

            # Keep the last good release so a bad deploy can be rolled back
            # without waiting for a revert commit to go through CI.
            rm -rf "$PREV"
            [ -d "$APP" ] && cp -a "$APP" "$PREV" || true

            sudo systemctl stop trader || true
            mkdir -p "$APP"
            rsync -a --delete --exclude logs --exclude '*.log' --exclude history-cache "$IN"/ "$APP"/
            chmod +x "$APP/TraderApp"
            sudo systemctl start trader

            # Restart=always means "active" proves nothing - a crash-looping
            # binary is active between crashes. Watch for 30s and require the
            # start counter to stay put.
            START_COUNT=$(systemctl show trader -p NRestarts --value)
            sleep 30
            NOW_COUNT=$(systemctl show trader -p NRestarts --value)
            STATE=$(systemctl is-active trader || true)

            if [ "$STATE" != "active" ] || [ "$NOW_COUNT" != "$START_COUNT" ]; then
              echo "::error::deploy failed health check (state=$STATE restarts $START_COUNT -> $NOW_COUNT) - rolling back"
              journalctl -u trader -n 60 --no-pager || true
              if [ -d "$PREV" ]; then
                sudo systemctl stop trader || true
                rsync -a --delete "$PREV"/ "$APP"/
                sudo systemctl start trader
                echo "rolled back to the previous release"
              fi
              exit 1
            fi

            echo "healthy at $(cat "$APP/DEPLOYED_SHA" 2>/dev/null || echo unknown)"
            journalctl -u trader -n 20 --no-pager || true
